[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hermes-trading-relay"
version = "0.1.0"
description = "OpenAI-compatible local relay for running TradingAgents through Hermes OAuth-authenticated Codex."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Kaleb / Hoaggie78" }]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
hermes-trading-relay = "hermes_trading_relay.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_trading_relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
